name: Dual-runtime plugin

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: ./scripts/build_codex_plugin.py --check
      - run: ./scripts/validate_dual_runtime.py
